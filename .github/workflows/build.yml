name: Build Customiuizer (a13, cloud-32bit)

on:
  push:
    branches: [ a13 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Preinstall SDK components + accept licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33" "build-tools;33.0.1" >/dev/null

      - name: Build io.github.libxposed:service:100-1.0.0 to mavenLocal (hilang dari maven publik)
        run: |
          git clone --depth 1 -b 100 https://github.com/libxposed/service.git /tmp/xservice
          cd /tmp/xservice
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon
          ls ~/.m2/repository/io/github/libxposed/service/ || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build develop APK
        run: ./gradlew assembleDevelop --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customiuizer-a13-develop
          path: app/build/outputs/apk/develop/*.apk
          if-no-files-found: error
